<!doctype html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Album priča · studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Lora:ital,wght@0,400;1,400;1,500&family=Pacifico&family=Bebas+Neue&family=Playfair+Display:wght@700;800&family=Oswald:wght@500;600&family=Fredoka:wght@400;600&family=Baloo+2:wght@500;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&family=Fraunces:opsz,wght@9..144,700&family=Caveat:wght@500;700&display=swap">
<style id="pageSize">@page{size:210mm 297mm;margin:0}</style>
<style>
:root{
  --desk:#DAD6CF; --bar:#F7F5F1; --line:#CFC9BF; --ink:#22252B; --muted:#6E6A63; --btn:#22252B; --btn-ink:#F7F5F1;
  --chip:#ECE8E1; --ok:#2F7A4F; --warn:#B4562C; --focus:#2E6BE6;
  --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --desk:#1E1F22; --bar:#2A2B2F; --line:#3A3B40; --ink:#ECEAE5; --muted:#A39F98; --btn:#ECEAE5; --btn-ink:#1E1F22; --chip:#34353A; color-scheme:dark } }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font:14px/1.45 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hidden{display:none!important}

/* traka */
#bar{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bar);border-bottom:1px solid var(--line)}
#trayBtn{display:none}
@media (max-width:760px){#trayBtn{display:inline-block}}
#bar .brand{font-weight:900;letter-spacing:-.02em;font-size:16px;white-space:nowrap}
#bar .brand span{font-family:Lora,serif;font-style:italic;font-weight:400;color:var(--muted)}
#bar .sep{width:1px;height:26px;background:var(--line)}
#bar input.name{font:600 15px var(--ui);border:1px solid transparent;background:transparent;color:var(--ink);padding:6px 8px;border-radius:6px;min-width:0;width:200px}
#bar input.name:hover,#bar input.name:focus{border-color:var(--line);background:var(--desk)}
.grow{flex:1}
.b{border:1px solid var(--line);background:var(--bar);padding:7px 12px;border-radius:7px;font-weight:600;font-size:13px;white-space:nowrap}
.b:hover{background:var(--chip)}
.b.dark{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.b.dark:hover{opacity:.9}
.b.sm{padding:4px 8px;font-size:12px}
.b.on{background:var(--btn);color:var(--btn-ink)}
select.b{appearance:auto;max-width:230px}
.count{font-size:12px;color:var(--muted);white-space:nowrap;border:0;background:none;padding:4px}
.count b{color:var(--ink)}
.count.bad b{color:var(--warn)}
.count.bad{text-decoration:underline dotted}

/* glavni dio */
#main{position:absolute;top:56px;left:0;right:0;bottom:0;display:flex}
#tray{width:248px;flex:none;background:var(--bar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tray .th{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
#tray .th .row{display:flex;gap:6px;align-items:center}
#tray .th h3{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#tray .hint{font-size:12px;color:var(--muted)}
#thumbs{flex:1;overflow:auto;padding:10px 12px 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
#thumbs.drag{outline:2px dashed var(--focus);outline-offset:-6px}
.th-i{position:relative;height:100px;border-radius:6px;overflow:hidden;background:var(--chip);cursor:grab}
.th-i img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.th-i .u{position:absolute;right:4px;top:4px;background:var(--btn);color:var(--btn-ink);font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px}
.th-i .x{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:20px;padding:0;display:none}
.th-i:hover .x{display:block}
.th-i.used img{opacity:.55}
.empty-tray{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:10px;padding:22px 14px;text-align:center;color:var(--muted);font-size:13px}
#canvas{flex:1;overflow:auto;position:relative;min-width:0}
#spreads{display:flex;flex-direction:column;align-items:center;gap:64px;padding:64px 24px 120px}
.spread{display:flex;gap:2px;position:relative}
.spread .lbl{display:none;position:absolute;top:-58px;left:0;right:0;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.holder{position:relative}
.holder.empty .pgz{visibility:hidden}
.pgz{zoom:var(--z,.5)}
.page-tools{position:absolute;left:0;right:0;bottom:100%;margin-bottom:2px;padding:2px 0;background:var(--desk);display:flex;gap:4px;align-items:center;justify-content:flex-end;opacity:.85;transition:opacity .15s;z-index:5;flex-wrap:wrap}
.holder:hover .page-tools,.holder:focus-within .page-tools{opacity:1}
.page-tools .tname{margin-right:auto;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.page-tools .b{padding:3px 7px;font-size:11.5px;border-radius:6px}
.page-tools select.b{padding:2px 4px;max-width:150px}
.page-tools .b.del.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.addbtw{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--bar);font-weight:700;line-height:22px;padding:0;opacity:0;transition:opacity .15s;z-index:6}
.holder:hover .addbtw{opacity:1}
.holder.left .addbtw{left:-34px} .holder.right .addbtw{right:-34px}
.pop{position:absolute;z-index:30;background:var(--bar);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;width:310px;display:flex;flex-direction:column;gap:8px;max-height:80vh;overflow:auto}
.pop label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.pop label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
.pop input,.pop select{font:13px var(--ui);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--desk);color:var(--ink)}
.pop .r{display:flex;gap:6px}
.pop .r>*{flex:1;min-width:0}

/* dijalozi */
.ov{position:fixed;inset:0;background:rgba(20,20,22,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--bar);border-radius:14px;max-width:920px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 4px;font-size:20px;letter-spacing:-.02em}
.dlg p.s{margin:0 0 16px;color:var(--muted)}
.dlg h4{margin:18px 0 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pick{border:1px solid var(--line);border-radius:10px;background:var(--desk);padding:7px;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:left}
button.pick:hover{border-color:var(--ink)}
.pick span{font-size:12px;font-weight:600;line-height:1.2}
.pick small{font-size:11px;color:var(--muted);font-weight:400;line-height:1.25}
.mini{position:relative;aspect-ratio:210/297;background:#fff;border-radius:3px;overflow:hidden}
.mini.dk{background:#3b3f47}.mini.cl{background:#EFE6D8}
.mini i{position:absolute;background:#C9C3B8;border-radius:1px}
.mini i.t{background:#8E887E;border-radius:2px}
.mini i.d{background:#E3B58A;border-radius:50%;opacity:.55}
.mini i.r{background:#ECE5DA}
.mini i.g{background:transparent;border:1px dashed #A8A196}
.mini i.a{background:linear-gradient(#F3E1C8,#C9D9C9)}
.mini i.m{background:radial-gradient(#B9C7BB 30%,transparent 31%) 0 0/6px 6px}
.addrow{display:flex;justify-content:center;padding:6px 0 0}
.pick.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
button.prow{font:inherit;color:inherit;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid var(--line);background:var(--desk);border-radius:20px;padding:6px 12px;font-weight:600;font-size:13px}
.chipb.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;font-size:13px;display:flex;gap:14px;align-items:center;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0;white-space:nowrap}
#busy{position:fixed;inset:0;background:rgba(20,20,22,.55);z-index:70;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:15px}

/* početni ekran */
#home{position:fixed;inset:0;background:var(--desk);z-index:40;overflow:auto}
#home .in{max-width:1100px;margin:0 auto;padding:40px 24px 80px}
#home h1{font-size:44px;line-height:1;letter-spacing:-.04em;margin:0;font-weight:900}
#home h1 em{font-family:Lora,serif;font-weight:400;letter-spacing:-.01em}
#home .lead{color:var(--muted);max-width:64ch;margin:12px 0 18px}
#home .hacts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
.acard{display:flex;flex-direction:column;gap:8px}
.acard .cv{aspect-ratio:210/297;border-radius:4px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;position:relative;background:#eee}
.cv svg{display:block;width:100%;height:100%}
.cv .tt{position:absolute;left:6%;right:6%;top:9%;text-align:center;font-size:22px;line-height:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.acard .meta{display:flex;justify-content:space-between;align-items:center;gap:6px}
.acard .meta b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.acard .meta small{color:var(--muted);font-size:12px}
.newcard{aspect-ratio:210/297;border:2px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:var(--muted);background:transparent;font-weight:600}
.newcard:hover{border-color:var(--ink);color:var(--ink)}
.newcard b{font-size:34px;font-weight:300;line-height:1}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.tpick{border:2px solid transparent;border-radius:8px;padding:2px;background:none;display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:12px;text-align:center}
.tpick .cv{aspect-ratio:210/297;border-radius:4px;overflow:hidden;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tpick .cv .tt{font-size:12px}
.tpick.on{border-color:var(--ink)}
.form{display:grid;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.form input,.form select{font:15px var(--ui);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--desk);color:var(--ink)}
.form .r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;align-items:center}
.note{background:var(--chip);border-radius:8px;padding:10px 12px;font-size:12.5px;color:var(--ink)}
.note.warn{background:#F6E1D6;color:#6B2E12}
.note.ok{background:#DCEFE3;color:#1E4D31}
.plan{font-size:13px;font-weight:600}
.warnbar{background:#B4562C;color:#fff;padding:8px 14px;font-size:13px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--desk)}
.prow b{flex:1}
.prow small{color:var(--muted)}

/* =========================================================
   STRANE ALBUMA (mm; boje i fontovi iz teme)
   ========================================================= */
.page{position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:var(--ui);color:var(--t-text)}
.trim{position:absolute;width:210mm;height:297mm}
.page *{box-sizing:border-box}
.trim>*{position:absolute}
.art svg,.deco svg{display:block;width:100%;height:100%}
.deco{pointer-events:none}
.tx{outline:none;border-radius:1mm;white-space:pre-wrap;cursor:text;overflow:visible;word-break:break-word}
.tx.one{white-space:nowrap}
.tx:hover{box-shadow:0 0 0 .4mm rgba(46,107,230,.35)}
.tx:focus{box-shadow:0 0 0 .5mm rgba(46,107,230,.8)}
.tx[data-ph]:empty::before{content:attr(data-ph);opacity:.38}
.s-display,.s-title,.s-num{font-family:var(--fd);font-weight:var(--fdw);text-transform:var(--fdc);letter-spacing:var(--fdl);font-style:var(--fdi);color:var(--t-title);line-height:1.12}
.s-script{font-family:var(--fs);color:var(--t-accent);line-height:1.15;font-weight:500}
.s-label{font-family:var(--ui);font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--t-accent);line-height:1.3}
.s-body{font-family:var(--fb);font-style:var(--fbi);line-height:1.55;color:var(--t-text)}
.s-cap{font-family:var(--fb);font-style:italic;color:var(--t-ink);opacity:.8;line-height:1.3}
.s-pcap{font-family:var(--fs);color:#3a3a3a;text-align:center;line-height:1;position:absolute;white-space:nowrap;overflow:visible}
.ondark .s-display,.ondark .s-title,.ondark .s-num,.ondark .s-body,.ondark .s-cap{color:var(--t-ondark)}
.ondark .s-label{color:var(--t-ondark);opacity:.85}
.shadow{text-shadow:0 0 5mm rgba(0,0,0,.45)}
.folio{position:absolute;bottom:8mm;font:700 7pt var(--ui);color:var(--t-ink);opacity:.5}
.page.L .folio{left:14mm} .page.R .folio{right:14mm}
.ondark .folio{color:var(--t-ondark)}
.lines{opacity:.35;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(100% / var(--n) - .3mm),var(--lc) calc(100% / var(--n) - .3mm),var(--lc) calc(100% / var(--n)))}
.mapw svg{display:block;width:100%;height:100%}

/* okviri */
.fr-polaroid,.fr-border{background:#fff;box-shadow:0 .5mm 2.2mm rgba(0,0,0,.2)}
.fr-circleb{background:var(--t-paper);border-radius:50%}
.slot{position:absolute;overflow:hidden;background:var(--t-soft)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;cursor:grab;user-select:none;-webkit-user-drag:none}
.slot img:active{cursor:grabbing}
.slot .hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2mm;font:600 8.5pt var(--ui);color:var(--t-ink);opacity:.5;cursor:pointer;text-align:center;padding:2mm;overflow:hidden}
.slot .hint small{font-weight:400;font-size:7pt}
.slot .hint svg{width:8mm;height:8mm;flex:none}
.slot.sm .hint span,.slot.sm .hint small{display:none}
.slot.over{box-shadow:inset 0 0 0 1.2mm #2E6BE6}
.slot .st{position:absolute;right:2mm;top:2mm;display:none;gap:1mm;z-index:3}
.slot.has:hover .st{display:flex}
.slot .st button{width:7mm;height:7mm;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font:700 10pt/7mm var(--ui);padding:0}
.slot .lr{position:absolute;left:2mm;bottom:2mm;background:#B4562C;color:#fff;font:700 6.5pt var(--ui);padding:.6mm 1.6mm;border-radius:2mm;z-index:2;pointer-events:none}
.slot .lr.bad{background:#B3261E}
.slot.glue{background:transparent;border:.6mm dashed color-mix(in srgb,var(--t-ink) 60%,transparent)}
.slot.glue.has{border:0}

@media (max-width:760px){
  html,body{max-width:100vw;overflow-x:hidden}
  #bar{overflow-x:auto;overflow-y:hidden;gap:6px;padding:0 8px;scrollbar-width:none}
  #bar .brand,#bar .sep{display:none}
  #bar input.name{width:120px;flex:none}
  #bar .b{padding:6px 9px}
  #home .in{padding:24px 14px 60px}
  #home h1{font-size:30px}
  .albums{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .ov{padding:8px;align-items:flex-start}
  .dlg{padding:16px 14px;max-height:calc(100% - 16px)}
  .themes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .picker{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .form .r,.form .r3{grid-template-columns:1fr}
  .form .r3 label{grid-column:auto!important}
  .dlg .acts{position:sticky;bottom:-16px;background:var(--bar);padding:10px 0;margin-bottom:-16px}
  #spreads{padding:70px 8px 120px;gap:70px}
  .spread{flex-direction:column;gap:70px}
  .holder.empty{display:none}
  .addbtw{display:none}
  #toast{left:8px;right:8px;transform:none;bottom:10px}
  #tray{position:absolute;left:0;top:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s}
  #tray.open{transform:none}
  #bar .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* štampa */
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  #bar,#tray,#home,.ov,#toast,#busy,.page-tools,.addbtw,.spread .lbl,.warnbar,#popRoot,.addrow{display:none!important}
  #main{position:static;display:block}
  #canvas{overflow:visible}
  #spreads{display:block;padding:0}
  .spread{display:contents}
  .holder.empty{display:none}
  .pgz{zoom:1!important}
  .page{box-shadow:none;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page.lastp{break-after:auto;page-break-after:auto}
  .slot .hint,.slot .st,.slot .lr{display:none!important}
  .slot:not(.has){background:transparent}
  .slot.glue{border-color:transparent}
  .tx[data-ph]:empty::before{content:none}
  .tx{box-shadow:none!important}
}
</style>
</head>
<body>
<div id="bar">
  <button class="b sm" id="trayBtn">Slike</button>
  <div class="brand">Album <span>priča</span></div>
  <div class="sep"></div>
  <button class="b" id="homeBtn">Svi albumi</button>
  <input class="name" id="projName" aria-label="Naziv albuma" spellcheck="false">
  <select class="b hide-s" id="themeSel" aria-label="Tema albuma"></select>
  <button class="b hide-s" id="metaBtn">Podaci albuma</button>
  <div class="grow"></div>
  <button class="count" id="count"></button>
  <button class="b hide-s" id="zoomOut" aria-label="Umanji">−</button>
  <button class="b hide-s" id="zoomIn" aria-label="Uvećaj">+</button>
  <button class="b" id="addPageBtn">+ Strana</button>
  <button class="b hide-s" id="backupBtn">Sačuvaj kopiju</button>
  <button class="b dark" id="printBtn">PDF za štampu</button>
</div>
<div id="main">
  <aside id="tray">
    <div class="th">
      <div class="row"><h3>Moje slike</h3><div class="grow"></div><span class="hint" id="imgCount"></span></div>
      <button class="b dark" id="addImgBtn">+ Dodaj slike</button>
      <div class="row">
        <select class="b sm" id="sortSel" style="flex:1" aria-label="Redoslijed slika"><option value="date">Po datumu</option><option value="name">Po nazivu</option><option value="added">Kako su dodate</option></select>
        <label class="hint" style="display:flex;gap:4px;align-items:center;white-space:nowrap"><input type="checkbox" id="unusedOnly"> nove</label>
      </div>
      <button class="b" id="autoBtn">Složi automatski</button>
    </div>
    <div id="thumbs"></div>
  </aside>
  <section id="canvas"><div id="spreads"></div></section>
</div>

<div id="home" class="hidden"><div class="in">
  <h1>Album <em>priča</em> studio</h1>
  <p class="lead">Napravi album za putovanje, bebu, rođendan, vjenčanje ili porodicu. Izabereš stil i broj slika, program složi kolaž strane, ti ubaciš slike i izvezeš PDF u A4 formatu spreman za štampariju.</p>
  <div class="hacts"><button class="b" id="libBtn">Kolaži i teme</button><button class="b" id="restoreBtn">Otvori kopiju (.album)</button></div>
  <div class="albums" id="albums"></div>
</div></div>

  plane(x, y, s, f, rot) { return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${n1(s / 24)}) translate(-12 -12)"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" fill="${f}"/></g>`; },
  ticket(x, y, w, h, f, c, hole) {
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${f}"/><circle cx="${n1(x + w * .7)}" cy="${y}" r="3" fill="${hole}"/><circle cx="${n1(x + w * .7)}" cy="${y + h}" r="3" fill="${hole}"/><line x1="${n1(x + w * .7)}" y1="${y + 4}" x2="${n1(x + w * .7)}" y2="${y + h - 4}" stroke="${c}" stroke-width="1" stroke-dasharray="2 2"/><rect x="${x + 6}" y="${y + 8}" width="${n1(w * .45)}" height="4" rx="2" fill="${c}"/><rect x="${x + 6}" y="${y + 16}" width="${n1(w * .3)}" height="3" rx="1.5" fill="${c}" opacity=".7"/><rect x="${x + 6}" y="${n1(y + h - 10)}" width="${n1(w * .5)}" height="3" rx="1.5" fill="${c}" opacity=".7"/>`;
  },
  cake(x, y, s, a, b, c, fl) {
    let o = `<rect x="${n1(x - s)}" y="${n1(y - s * .62)}" width="${n1(2 * s)}" height="${n1(s * .62)}" rx="${n1(s * .08)}" fill="${a}"/><rect x="${n1(x - s * .72)}" y="${n1(y - s * 1.12)}" width="${n1(1.44 * s)}" height="${n1(s * .52)}" rx="${n1(s * .08)}" fill="${b}"/>`;
    o += DR.wline(x - s * .72, y - s * 1.08, s * 1.44, s * .1, 4, c, s * .12) + DR.wline(x - s, y - s * .58, s * 2, s * .1, 5, c, s * .12);
    for (const dx of [-.4, 0, .4]) o += `<rect x="${n1(x + dx * s - s * .05)}" y="${n1(y - s * 1.45)}" width="${n1(s * .1)}" height="${n1(s * .34)}" fill="${c}"/><ellipse cx="${n1(x + dx * s)}" cy="${n1(y - s * 1.55)}" rx="${n1(s * .07)}" ry="${n1(s * .12)}" fill="${fl}"/>`;
    return o;
  },
  gift(x, y, s, f, rib) {
    return `<rect x="${n1(x - s)}" y="${n1(y - s * 1.2)}" width="${n1(2 * s)}" height="${n1(s * 1.2)}" fill="${f}"/><rect x="${n1(x - s * 1.1)}" y="${n1(y - s * 1.5)}" width="${n1(2.2 * s)}" height="${n1(s * .34)}" fill="${f}"/><rect x="${n1(x - s * .14)}" y="${n1(y - s * 1.5)}" width="${n1(s * .28)}" height="${n1(s * 1.5)}" fill="${rib}"/><ellipse cx="${n1(x - s * .32)}" cy="${n1(y - s * 1.66)}" rx="${n1(s * .34)}" ry="${n1(s * .18)}" fill="none" stroke="${rib}" stroke-width="${n1(s * .12)}"/><ellipse cx="${n1(x + s * .32)}" cy="${n1(y - s * 1.66)}" rx="${n1(s * .34)}" ry="${n1(s * .18)}" fill="none" stroke="${rib}" stroke-width="${n1(s * .12)}"/>`;
  },
  rings(x, y, r, s, w) { return `<circle cx="${n1(x - r * .45)}" cy="${y}" r="${r}" fill="none" stroke="${s}" stroke-width="${w}"/><circle cx="${n1(x + r * .45)}" cy="${y}" r="${r}" fill="none" stroke="${s}" stroke-width="${w}"/><polygon points="${n1(x - r * .45)},${n1(y - r - r * .55)} ${n1(x - r * .2)},${n1(y - r - r * .25)} ${n1(x - r * .45)},${n1(y - r + .2)} ${n1(x - r * .7)},${n1(y - r - r * .25)}" fill="${s}"/>`; },
  branch(x, y, len, rot, stem, leaf) {
    let o = `<g transform="translate(${x} ${y}) rotate(${rot})"><path d="M0 0Q${n1(len * .08)} ${n1(-len * .5)} 0 ${-len}" stroke="${stem}" stroke-width="1.3" fill="none"/>`;
    for (let i = 1; i <= 6; i++) { const t = i / 7, py = -len * t, r = len * (.075 - t * .03); o += `<ellipse cx="${n1(-r * 1.3)}" cy="${n1(py)}" rx="${n1(r * 1.1)}" ry="${n1(r * .8)}" fill="${leaf}"/><ellipse cx="${n1(r * 1.3 + len * .03)}" cy="${n1(py - r * .6)}" rx="${n1(r * 1.1)}" ry="${n1(r * .8)}" fill="${leaf}"/>`; }
    return o + `<ellipse cx="0" cy="${-len}" rx="${n1(len * .035)}" ry="${n1(len * .05)}" fill="${leaf}"/></g>`;
  },
  pineBranch(x, y, len, rot, c) {
    let o = `<g transform="translate(${x} ${y}) rotate(${rot})" stroke="${c}" stroke-linecap="round" fill="none"><line x1="0" y1="0" x2="0" y2="${-len}" stroke-width="1.6"/>`;
    for (let t = .12; t < .98; t += .07) { const py = -len * t, l = len * .2 * (1 - t * .6); o += `<line x1="0" y1="${n1(py)}" x2="${n1(-l)}" y2="${n1(py - l * .7)}" stroke-width="1.1"/><line x1="0" y1="${n1(py)}" x2="${n1(l)}" y2="${n1(py - l * .7)}" stroke-width="1.1"/>`; }
    return o + "</g>";
  },
  confetti(W, H, n, cols, seed = 7) {
    let s = seed, o = ""; const R = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < n; i++) { const x = n1(R() * W), y = n1(R() * H), c = cols[i % cols.length]; o += R() < .5 ? `<rect x="${x}" y="${y}" width="${n1(2 + R() * 3)}" height="${n1(1.2 + R() * 1.4)}" transform="rotate(${Math.round(R() * 180)} ${x} ${y})" fill="${c}"/>` : `<circle cx="${x}" cy="${y}" r="${n1(.8 + R() * 1.4)}" fill="${c}"/>`; }
    return o;
  },
  bunting(x0, x1, y, cols, fh, sag = 8) {
    const n = Math.max(3, Math.round((x1 - x0) / (fh * .95))), w = (x1 - x0) / n;
    let o = `<path d="M${x0} ${y}Q${n1((x0 + x1) / 2)} ${n1(y + sag * 2)} ${x1} ${y}" stroke="#00000055" stroke-width=".6" fill="none"/>`;
    for (let i = 0; i < n; i++) { const t0 = i / n, t1 = (i + 1) / n, xa = x0 + w * i, xb = xa + w, ya = y + sag * 4 * t0 * (1 - t0), yb = y + sag * 4 * t1 * (1 - t1); o += `<polygon points="${n1(xa + .6)},${n1(ya)} ${n1(xb - .6)},${n1(yb)} ${n1((xa + xb) / 2)},${n1((ya + yb) / 2 + fh)}" fill="${cols[i % cols.length]}"/>`; }
    return o;
  },
  birds(x, y, s, c) { return `<path d="M${x} ${y}q${n1(s * .5)} ${n1(-s * .5)} ${s} 0q${n1(s * .5)} ${n1(-s * .5)} ${s} 0" stroke="${c}" stroke-width="1" fill="none" stroke-linecap="round"/>`; },
  dots(w, y, r, c, step = 10) { let o = ""; for (let x = r; x < w; x += step) o += `<circle cx="${n1(x)}" cy="${y}" r="${r}" fill="${c}"/>`; return o; },
};

function preflight() {
  const empty = [], low = [], bad = [];
  P.pages.forEach((p, idx) => {
    const dims = slotDims(LAY(p.l), p);
    p.s.forEach((s, i) => {
      if (!dims[i]) return;
      if (!s) { if (!dims[i].glue) empty.push(idx + 1); return; }
      const d = dpiOf(s, dims[i].w, dims[i].h);
      if (d < 100) bad.push(idx + 1); else if (d < 150) low.push(idx + 1);
    });
  });
  const u = a => [...new Set(a)];
  return { empty: u(empty), low: u(low), bad: u(bad), n: P.pages.length };
}
function openExport() {
  if (!P) return;
  const f = preflight();
  const li = (cls, txt) => `<div class="note ${cls}" style="margin-top:8px">${txt}</div>`;

    ${f.empty.length ? li("warn", `Prazni okviri na stranama: ${pg(f.empty)}. Biće bez slike u PDF-u.`) : ""}
    ${f.bad.length ? li("warn", `<b>Premale slike</b> (ispod 100 dpi, biće mutne) na stranama: ${pg(f.bad)}. Zamijeni ih ili stavi u manji okvir.`) : ""}
    ${f.low.length ? li("", `Slike niže rezolucije (100–150 dpi) na stranama: ${pg(f.low)}. Biće prihvatljive, ali ne savršeno oštre.`) : ""}
    <h4>Format fajla</h4>

    </div>

let printURLs = [];
async function doPrint(bleed, optimize) {
  busy("Pripremam strane za štampu…");
  BLEED = bleed;
  $("#pageSize").textContent = `@page{size:${210 + 2 * bleed}mm ${297 + 2 * bleed}mm;margin:0}`;
  render();
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  fitAll();
  try {
    const imgs = $$("#spreads .slot img"), need = {};
    for (const img of imgs) {
      const slot = img.closest(".slot"), id = img.dataset.id, im = IMG.get(id), p = pageOf(slot), s = p.s[+slot.dataset.i];
      const w = +slot.dataset.w, h = +slot.dataset.h, mmpp = Math.max(w / im.w, h / im.h) * (s.z || 1);
      const f = Math.min(1, (300 / 25.4) * mmpp * 1.1);
      need[id] = Math.max(need[id] || 0, f);
    }
    const map = {}, ids = Object.keys(need); let k = 0;
    for (const id of ids) {
      busy(`Pripremam slike u punoj rezoluciji… ${++k} / ${ids.length}`);
      const r = await load("images", id); if (!r || !r.orig) continue;
      let blob = r.orig;
      if (optimize && need[id] < .85) { try { const bmp = await createImageBitmap(r.orig); blob = await scaled(bmp, Math.round(Math.max(bmp.width, bmp.height) * need[id]), .93); bmp.close && bmp.close(); } catch (e) { blob = r.orig; } }
      const u = URL.createObjectURL(blob); map[id] = u; printURLs.push(u);
    }
    await Promise.all(imgs.map(img => { if (map[img.dataset.id]) { img.src = map[img.dataset.id]; return img.decode().catch(() => {}); } }));
    await document.fonts.ready;
  } catch (e) {}
  busy(false);
  setTimeout(() => window.print(), 60);
}
window.addEventListener("afterprint", () => {
  if (!P) return;
  BLEED = 0; $("#pageSize").textContent = "@page{size:210mm 297mm;margin:0}";
  printURLs.forEach(u => URL.revokeObjectURL(u)); printURLs = [];
  render();
  toast("Ako PDF nije sačuvan: izaberi „Sačuvaj kao PDF”, margine „Nijedne” i uključi „Grafika u pozadini”.");
});
